name: CadCore CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify Tianzheng PE export probe parser
        shell: pwsh
        run: |
          $output = & ./tools/tianzheng-probe/TianzhengExportProbe.ps1 `
            -ModulePath "$env:SystemRoot\System32\kernel32.dll" `
            -MatchPattern '^CreateFile[AW]$' `
            -RequireMatch
          $joined = $output -join "`n"
          if ($joined -match [regex]::Escape($env:SystemRoot)) {
            throw 'TianzhengExportProbe must not emit the source module path.'
          }
          if ($joined -notmatch '\[TCHSYM\] Symbol=CreateFileA' -or
              $joined -notmatch '\[TCHSYM\] Symbol=CreateFileW') {
            throw 'TianzhengExportProbe did not parse expected kernel32 exports.'
          }
          $output | Write-Host

          $badPath = Join-Path $env:RUNNER_TEMP 'cadcore-tchsym-invalid.bin'
          [IO.File]::WriteAllBytes($badPath, [byte[]]::new(64))
          $rejected = $false
          try {
            & ./tools/tianzheng-probe/TianzhengExportProbe.ps1 `
              -ModulePath $badPath `
              -MatchPattern 'anything' | Out-Null
          }
          catch {
            $rejected = $true
          }
          finally {
            Remove-Item -LiteralPath $badPath -Force -ErrorAction SilentlyContinue
          }
          if (-not $rejected) {
            throw 'TianzhengExportProbe must fail closed for malformed PE input.'
          }
      - run: dotnet restore SpatialViewer.CadCore.sln
      - run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - name: Verify Xiangyuan privacy-safe corpus probe
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'xiangyuan-corpus-smoke.json'
          dotnet run --project tools/SpatialViewer.CadCore.XiangyuanProbe/SpatialViewer.CadCore.XiangyuanProbe.csproj -c Release --no-build -- --out $report tests/fixtures/cad/dxf/mixed-basic.dxf
          if ($LASTEXITCODE -ne 0) { throw "Xiangyuan corpus probe failed with exit code $LASTEXITCODE" }
          $json = Get-Content -LiteralPath $report -Raw
          if ($json -match 'mixed-basic\.dxf') { throw 'Xiangyuan corpus report leaked the source drawing name.' }
          $parsed = $json | ConvertFrom-Json
          if ($parsed.schemaVersion -ne 1 -or $parsed.sampleCount -ne 1) { throw 'Unexpected Xiangyuan corpus smoke-report shape.' }
          if ($parsed.entries.Count -ne 0) { throw 'Ordinary CAD smoke fixture must not be classified as Xiangyuan.' }
          Remove-Item -LiteralPath $report -Force

          $discovery = Join-Path $env:RUNNER_TEMP 'xiangyuan-discovery-smoke.json'
          dotnet run --project tools/SpatialViewer.CadCore.XiangyuanProbe/SpatialViewer.CadCore.XiangyuanProbe.csproj -c Release --no-build -- --discovery --out $discovery tests/fixtures/cad/dxf/mixed-basic.dxf
          if ($LASTEXITCODE -ne 0) { throw "Xiangyuan discovery probe failed with exit code $LASTEXITCODE" }
          $discoveryJson = Get-Content -LiteralPath $discovery -Raw
          if ($discoveryJson -match 'mixed-basic\.dxf') { throw 'Xiangyuan discovery report leaked the source drawing name.' }
          $discoveryParsed = $discoveryJson | ConvertFrom-Json
          if ($discoveryParsed.schemaVersion -ne 1 -or $discoveryParsed.sampleCount -ne 1) { throw 'Unexpected Xiangyuan discovery smoke-report shape.' }
          if ($discoveryParsed.classes.Count -ne 0 -or $discoveryParsed.profiles.Count -ne 0) { throw 'Ordinary CAD smoke fixture must not invent custom-object discovery entries.' }
          Remove-Item -LiteralPath $discovery -Force

          $conversion = Join-Path $env:RUNNER_TEMP 'xiangyuan-conversion-smoke.json'
          dotnet run --project tools/SpatialViewer.CadCore.XiangyuanProbe/SpatialViewer.CadCore.XiangyuanProbe.csproj -c Release --no-build -- --conversion-diff --out $conversion tests/fixtures/cad/dxf/mixed-basic.dxf tests/fixtures/cad/dxf/mixed-basic.dxf
          if ($LASTEXITCODE -ne 0) { throw "Xiangyuan conversion diff probe failed with exit code $LASTEXITCODE" }
          $conversionJson = Get-Content -LiteralPath $conversion -Raw
          if ($conversionJson -match 'mixed-basic\.dxf') { throw 'Xiangyuan conversion diff leaked the source drawing name.' }
          $conversionParsed = $conversionJson | ConvertFrom-Json
          if ($conversionParsed.schemaVersion -ne 1 -or $conversionParsed.nativeSampleCount -ne 1 -or $conversionParsed.convertedSampleCount -ne 1) { throw 'Unexpected Xiangyuan conversion-diff smoke-report shape.' }
          if ($conversionParsed.classes.Count -ne 0 -or $conversionParsed.profiles.Count -ne 0) { throw 'Identical ordinary CAD inputs must produce an empty custom-object conversion diff.' }

          $conversion2 = Join-Path $env:RUNNER_TEMP 'xiangyuan-conversion-smoke-2.json'
          Copy-Item -LiteralPath $conversion -Destination $conversion2 -Force
          $consensus = Join-Path $env:RUNNER_TEMP 'xiangyuan-conversion-consensus-smoke.json'
          dotnet run --project tools/SpatialViewer.CadCore.XiangyuanProbe/SpatialViewer.CadCore.XiangyuanProbe.csproj -c Release --no-build -- --conversion-consensus --out $consensus $conversion $conversion2
          if ($LASTEXITCODE -ne 0) { throw "Xiangyuan conversion consensus probe failed with exit code $LASTEXITCODE" }
          $consensusJson = Get-Content -LiteralPath $consensus -Raw
          if ($consensusJson -match 'mixed-basic\.dxf') { throw 'Xiangyuan conversion consensus leaked a source drawing name.' }
          $consensusParsed = $consensusJson | ConvertFrom-Json
          if ($consensusParsed.schemaVersion -ne 1 -or $consensusParsed.pairCount -ne 2) { throw 'Unexpected Xiangyuan conversion-consensus smoke-report shape.' }
          if ($consensusParsed.classes.Count -ne 0 -or $consensusParsed.profiles.Count -ne 0) { throw 'Empty conversion diffs must produce an empty conversion consensus.' }

          $documentPair = Join-Path $env:RUNNER_TEMP 'xiangyuan-document-pair-smoke.json'
          dotnet run --project tools/SpatialViewer.CadCore.XiangyuanProbe/SpatialViewer.CadCore.XiangyuanProbe.csproj -c Release --no-build -- --document-pair --out $documentPair tests/fixtures/cad/dxf/mixed-basic.dxf tests/fixtures/cad/dxf/mixed-basic.dxf
          if ($LASTEXITCODE -ne 0) { throw "Xiangyuan document-pair probe failed with exit code $LASTEXITCODE" }
          $documentPairJson = Get-Content -LiteralPath $documentPair -Raw
          if ($documentPairJson -match 'mixed-basic\.dxf') { throw 'Xiangyuan document-pair report leaked the source drawing name.' }
          $documentPairParsed = $documentPairJson | ConvertFrom-Json
          if ($documentPairParsed.schemaVersion -ne 1 -or $documentPairParsed.provenance -ne 0) { throw 'Unexpected explicit Xiangyuan document-pair smoke-report shape.' }
          if ($documentPairParsed.beforeEligibleEntityCount -ne 0 -or $documentPairParsed.afterEligibleEntityCount -ne 0 -or $documentPairParsed.matchedEntityCount -ne 0) { throw 'Ordinary CAD smoke fixture must not invent explicit Xiangyuan document-pair entities.' }

          $candidateConsensus = Join-Path $env:RUNNER_TEMP 'xiangyuan-candidate-consensus-smoke.json'
          $candidateConsensusData = @{
            schemaVersion = 1
            pairCount = 2
            classes = @(
              @{
                dxfName = 'PRIVATE_CANDIDATE'
                cppClassName = 'PrivateCandidate'
                applicationName = 'PrivatePlanningApp'
                classifiedVendor = 0
                isEntity = $true
                wasProxy = $true
                proxyFlags = 'None'
                observedPairCount = 2
                removedPairCount = 2
                retainedPairCount = 0
                addedPairCount = 0
              }
            )
            profiles = @()
          }
          $candidateConsensusData | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $candidateConsensus -Encoding utf8 -NoNewline

          $candidatePair = Join-Path $env:RUNNER_TEMP 'xiangyuan-candidate-document-pair-smoke.json'
          dotnet run --project tools/SpatialViewer.CadCore.XiangyuanProbe/SpatialViewer.CadCore.XiangyuanProbe.csproj -c Release --no-build -- --candidate-document-pair --candidate-consensus $candidateConsensus --candidate-index 1 --out $candidatePair tests/fixtures/cad/dxf/mixed-basic.dxf tests/fixtures/cad/dxf/mixed-basic.dxf
          if ($LASTEXITCODE -ne 0) { throw "Xiangyuan candidate document-pair probe failed with exit code $LASTEXITCODE" }
          $candidatePairJson = Get-Content -LiteralPath $candidatePair -Raw
          if ($candidatePairJson -match 'mixed-basic\.dxf' -or $candidatePairJson -match 'candidate-consensus-smoke') { throw 'Xiangyuan candidate document-pair report leaked an input file name.' }
          $candidatePairParsed = $candidatePairJson | ConvertFrom-Json
          if ($candidatePairParsed.schemaVersion -ne 1 -or $candidatePairParsed.provenance -ne 1) { throw 'Unexpected candidate Xiangyuan document-pair smoke-report shape.' }
          if ($candidatePairParsed.beforeEligibleEntityCount -ne 0 -or $candidatePairParsed.afterEligibleEntityCount -ne 0 -or $candidatePairParsed.matchedEntityCount -ne 0) { throw 'Unrelated ordinary CAD must not match the synthetic repeated candidate.' }

          Remove-Item -LiteralPath $conversion, $conversion2, $consensus, $documentPair, $candidateConsensus, $candidatePair -Force
      - name: Build performance baseline
        run: dotnet build benchmarks/SpatialViewer.Core.Benchmarks/SpatialViewer.Core.Benchmarks.csproj -c Release
      - run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal
      - name: Verify product, ABI and host contract
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [version][string]$props.Project.PropertyGroup.Version
          $abiVersion = [version][string]$props.Project.PropertyGroup.AbiVersion
          $hostName = [string]$props.Project.PropertyGroup.HostContractName
          $hostMin = [version][string]$props.Project.PropertyGroup.HostContractMinVersion
          $hostMax = [version][string]$props.Project.PropertyGroup.HostContractMaxVersionExclusive
          $schema = [int][string]$props.Project.PropertyGroup.ReleaseManifestSchemaVersion
          if (-not $abiVersion) { throw 'AbiVersion is missing.' }
          if ($schema -ne 2) { throw "ReleaseManifestSchemaVersion must be 2, got $schema" }
          if ($hostName -cne 'SpatialViewer.CadHost') { throw "Unexpected host contract name: $hostName" }
          if ($hostMin -ge $hostMax) { throw "Invalid host contract range: $hostMin..<${hostMax}" }
          $normalizedProduct = [version]::new($version.Major, $version.Minor, [Math]::Max(0, $version.Build))
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $dll = Get-ChildItem "src/$project/bin/Release" -Recurse -Filter "$project.dll" | Select-Object -First 1
            if (-not $dll) { throw "Release assembly not found: $project.dll" }
            $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version
            if ($assemblyVersion -ne $abiVersion) { throw "ABI mismatch for $project.dll: $assemblyVersion != $abiVersion" }
            $fileVersion = [version][Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).FileVersion
            $normalizedFile = [version]::new($fileVersion.Major, $fileVersion.Minor, [Math]::Max(0, $fileVersion.Build))
            if ($normalizedFile -ne $normalizedProduct) { throw "FileVersion mismatch for $project.dll: $fileVersion != $version" }
          }
          Write-Host "CadCore contract PASS: product=$version ABI=$abiVersion host=$hostName $hostMin..<${hostMax} schema=$schema"
