name: CadCore CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SpatialViewer.CadCore.sln
      - run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - name: Build performance baseline
        run: dotnet build benchmarks/SpatialViewer.Core.Benchmarks/SpatialViewer.Core.Benchmarks.csproj -c Release
      - run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal
      - name: Verify product, ABI and host contract
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [version][string]$props.Project.PropertyGroup.Version
          $abiVersion = [version][string]$props.Project.PropertyGroup.AbiVersion
          $hostName = [string]$props.Project.PropertyGroup.HostContractName
          $hostMin = [version][string]$props.Project.PropertyGroup.HostContractMinVersion
          $hostMax = [version][string]$props.Project.PropertyGroup.HostContractMaxVersionExclusive
          $schema = [int][string]$props.Project.PropertyGroup.ReleaseManifestSchemaVersion
          if (-not $abiVersion) { throw 'AbiVersion is missing.' }
          if ($schema -ne 2) { throw "ReleaseManifestSchemaVersion must be 2, got $schema" }
          if ($hostName -cne 'SpatialViewer.CadHost') { throw "Unexpected host contract name: $hostName" }
          if ($hostMin -ge $hostMax) { throw "Invalid host contract range: $hostMin..<${hostMax}" }
          $normalizedProduct = [version]::new($version.Major, $version.Minor, [Math]::Max(0, $version.Build))
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $dll = Get-ChildItem "src/$project/bin/Release" -Recurse -Filter "$project.dll" | Select-Object -First 1
            if (-not $dll) { throw "Release assembly not found: $project.dll" }
            $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version
            if ($assemblyVersion -ne $abiVersion) { throw "ABI mismatch for $project.dll: $assemblyVersion != $abiVersion" }
            $fileVersion = [version][Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).FileVersion
            $normalizedFile = [version]::new($fileVersion.Major, $fileVersion.Minor, [Math]::Max(0, $fileVersion.Build))
            if ($normalizedFile -ne $normalizedProduct) { throw "FileVersion mismatch for $project.dll: $fileVersion != $version" }
          }
          Write-Host "CadCore contract PASS: product=$version ABI=$abiVersion host=$hostName $hostMin..<${hostMax} schema=$schema"
