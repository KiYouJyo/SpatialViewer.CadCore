name: CadCore CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SpatialViewer.CadCore.sln
      - run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal
