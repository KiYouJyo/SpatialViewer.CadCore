name: Publish CadCore Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version and ABI
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $abiVersion = [string]$props.Project.PropertyGroup.AbiVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing from Directory.Build.props' }
          if ([string]::IsNullOrWhiteSpace($abiVersion)) { throw 'AbiVersion is missing from Directory.Build.props' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "abiVersion=$abiVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore SpatialViewer.CadCore.sln
      - name: Build Debug
        run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - name: Build Release
        run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - name: Build performance baseline
        run: dotnet build benchmarks/SpatialViewer.Core.Benchmarks/SpatialViewer.Core.Benchmarks.csproj -c Release
      - name: Test Release
        run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal

      - name: Verify product version and stable ABI
        shell: pwsh
        run: |
          $version = [version]'${{ steps.version.outputs.version }}'
          $abiVersion = [version]'${{ steps.version.outputs.abiVersion }}'
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $dll = Get-ChildItem "src/$project/bin/Release" -Recurse -Filter "$project.dll" | Select-Object -First 1
            if (-not $dll) { throw "Release assembly not found: $project.dll" }
            $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version
            if ($assemblyVersion -ne $abiVersion) { throw "ABI mismatch for $project.dll: $assemblyVersion != $abiVersion" }
            $fileVersionText = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).FileVersion
            $fileVersion = [version]$fileVersionText
            $normalizedFileVersion = [version]::new($fileVersion.Major, $fileVersion.Minor, [Math]::Max(0, $fileVersion.Build))
            $normalizedProductVersion = [version]::new($version.Major, $version.Minor, [Math]::Max(0, $version.Build))
            if ($normalizedFileVersion -ne $normalizedProductVersion) { throw "Product version mismatch for $project.dll: $fileVersionText != $version" }
          }
          Write-Host "CadCore release identity PASS: product=$version ABI=$abiVersion"

      - name: Package release binaries
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $abiVersion = '${{ steps.version.outputs.abiVersion }}'
          $root = Join-Path $PWD 'release-package'
          $bin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $source = Join-Path $PWD "src/$project/bin/Release"
            if (-not (Test-Path $source)) { throw "Release output not found: $source" }
            Copy-Item $source (Join-Path $bin $project) -Recurse -Force
          }
          $manifest = [ordered]@{
            product = 'SpatialViewer.CadCore'
            version = $version
            abiVersion = $abiVersion
            tag = "v$version"
            commit = $env:GITHUB_SHA
            runtime = 'x64'
            framework = 'net10.0'
            sourceRepository = 'KiYouJyo/SpatialViewer.CadCore'
            compatibility = 'SpatialViewer 0.2.x'
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $root 'cadcore-release.json') -Value $manifest -Encoding utf8
          Copy-Item CHANGELOG.md (Join-Path $root 'CHANGELOG.md')
          Copy-Item LICENSE (Join-Path $root 'LICENSE')
          $zip = Join-Path $PWD "CadCore-v$version-x64.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path (Join-Path $PWD 'SHA256SUMS.txt') -Encoding ascii

      - name: Write release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $abiVersion = '${{ steps.version.outputs.abiVersion }}'
          @"
          ## SpatialViewer.CadCore v$version

          ### 中文
          - 修复圆弧拾取：只在真实起始角/扫掠角范围内命中，不再把整圆误判为可选圆弧。
          - 修复缩放/压缩块内对象的拾取容差，世界坐标容差现在会通过逆仿射变换换算到实体局部空间。
          - Scene2D 在构造时一次性展开不可变节点变换与边界，后续枚举、边界查询和拾取复用缓存结果；图层显隐仍保持实时生效。
          - 增加 10 万图元无额外依赖性能基线，为后续 Spatial Index / 大图优化提供可比较基准。
          - CLR ABI 继续稳定为 `$abiVersion`，与 v0.3.1 保持二进制兼容。

          ### 日本語
          - 円弧のヒットテストを修正し、実際の開始角・スイープ角の範囲だけを選択対象にしました。
          - 縮小・非等方変換されたブロック内要素でも、ワールド座標の許容誤差を逆アフィン変換でローカル空間へ正しく変換します。
          - Scene2D は不変ノードの変換と境界を構築時に一度だけ展開し、列挙・境界取得・ヒットテストで再利用します。レイヤー表示状態は引き続き動的です。
          - 10 万要素の依存なし性能ベースラインを追加し、将来の Spatial Index / 大規模図面最適化と比較できるようにしました。
          - CLR ABI は `$abiVersion` のまま維持し、v0.3.1 とバイナリ互換です。

          ### English
          - Arc hit testing now honors the actual start/sweep range instead of treating the entire parent circle as selectable.
          - World-space hit tolerance is transformed into entity-local space for compressed and non-uniformly transformed block contents.
          - Scene2D now flattens immutable transforms and bounds once at construction and reuses the cached items for enumeration, bounds, and hit testing while keeping layer visibility live.
          - Adds a dependency-free 100k-item performance baseline for future Spatial Index and large-drawing work.
          - The CLR ABI remains `$abiVersion`, preserving binary compatibility with v0.3.1.
          "@ | Set-Content release-notes.md -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "$tag already exists; skipping release creation."
            exit 0
          }
          gh release create $tag `
            "CadCore-v${{ steps.version.outputs.version }}-x64.zip" `
            'SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "SpatialViewer.CadCore $tag" `
            --notes-file release-notes.md `
            --latest
