name: Publish CadCore Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing from Directory.Build.props' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore SpatialViewer.CadCore.sln
      - name: Build Debug
        run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - name: Build Release
        run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - name: Test Release
        run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal

      - name: Package release binaries
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $root = Join-Path $PWD 'release-package'
          $bin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $source = Join-Path $PWD "src/$project/bin/Release"
            if (-not (Test-Path $source)) { throw "Release output not found: $source" }
            Copy-Item $source (Join-Path $bin $project) -Recurse -Force
          }
          $manifest = [ordered]@{
            product = 'SpatialViewer.CadCore'
            version = $version
            tag = "v$version"
            commit = $env:GITHUB_SHA
            runtime = 'x64'
            framework = 'net10.0'
            sourceRepository = 'KiYouJyo/SpatialViewer.CadCore'
            compatibility = 'SpatialViewer 0.2.x'
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $root 'cadcore-release.json') -Value $manifest -Encoding utf8
          Copy-Item CHANGELOG.md (Join-Path $root 'CHANGELOG.md')
          Copy-Item LICENSE (Join-Path $root 'LICENSE')
          $zip = Join-Path $PWD "CadCore-v$version-x64.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path (Join-Path $PWD 'SHA256SUMS.txt') -Encoding ascii

      - name: Write release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          @"
          ## SpatialViewer.CadCore v$version

          ### 中文
          - 保留 AutoCAD ACI 1–255、TrueColor / ByLayer / ByBlock 颜色语义修复与 0.25 px 自适应圆弧细分。
          - 提供可由 SpatialViewer 0.2.x 校验并下载的 x64 独立内核包。
          - 包含版本、提交、架构、来源仓库与兼容范围清单，并同时发布 SHA-256 校验文件。
          - v0.2.1 建立独立内核重启更新所需的明确版本边界；渲染行为与 v0.2.0 一致。

          ### 日本語
          - AutoCAD ACI 1–255、TrueColor / ByLayer / ByBlock の色処理修正と 0.25 px 適応円弧分割を維持。
          - SpatialViewer 0.2.x が検証・ダウンロードできる x64 独立カーネルパッケージを提供。
          - バージョン、コミット、アーキテクチャ、配布元、互換範囲のマニフェストと SHA-256 を同梱。
          - v0.2.1 は再起動方式の独立カーネル更新用に明確なバージョン境界を設けます。描画動作は v0.2.0 と同一です。

          ### English
          - Retains the AutoCAD ACI 1–255, TrueColor / ByLayer / ByBlock fixes and adaptive 0.25 px arc tessellation.
          - Publishes an x64 independent kernel package that SpatialViewer 0.2.x can validate and download.
          - Ships manifest metadata for version, commit, runtime, source repository, compatibility, plus SHA-256 verification.
          - v0.2.1 establishes a clean version boundary for restart-safe independent kernel updates; rendering behavior is unchanged from v0.2.0.
          "@ | Set-Content release-notes.md -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "$tag already exists; skipping release creation."
            exit 0
          }
          gh release create $tag `
            "CadCore-v${{ steps.version.outputs.version }}-x64.zip" `
            'SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "SpatialViewer.CadCore $tag" `
            --notes-file release-notes.md `
            --latest
