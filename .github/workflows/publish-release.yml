name: Publish CadCore Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version and ABI
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $abiVersion = [string]$props.Project.PropertyGroup.AbiVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing from Directory.Build.props' }
          if ([string]::IsNullOrWhiteSpace($abiVersion)) { throw 'AbiVersion is missing from Directory.Build.props' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "abiVersion=$abiVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore SpatialViewer.CadCore.sln
      - name: Build Debug
        run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - name: Build Release
        run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - name: Build performance baseline
        run: dotnet build benchmarks/SpatialViewer.Core.Benchmarks/SpatialViewer.Core.Benchmarks.csproj -c Release
      - name: Test Release
        run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal

      - name: Verify product version and stable ABI
        shell: pwsh
        run: |
          $version = [version]'${{ steps.version.outputs.version }}'
          $abiVersion = [version]'${{ steps.version.outputs.abiVersion }}'
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $dll = Get-ChildItem "src/$project/bin/Release" -Recurse -Filter "$project.dll" | Select-Object -First 1
            if (-not $dll) { throw "Release assembly not found: $project.dll" }
            $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version
            if ($assemblyVersion -ne $abiVersion) { throw "ABI mismatch for $project.dll: $assemblyVersion != $abiVersion" }
            $fileVersionText = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).FileVersion
            $fileVersion = [version]$fileVersionText
            $normalizedFileVersion = [version]::new($fileVersion.Major, $fileVersion.Minor, [Math]::Max(0, $fileVersion.Build))
            $normalizedProductVersion = [version]::new($version.Major, $version.Minor, [Math]::Max(0, $version.Build))
            if ($normalizedFileVersion -ne $normalizedProductVersion) { throw "Product version mismatch for $project.dll: $fileVersionText != $version" }
          }
          Write-Host "CadCore release identity PASS: product=$version ABI=$abiVersion"

      - name: Package release binaries
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $abiVersion = '${{ steps.version.outputs.abiVersion }}'
          $root = Join-Path $PWD 'release-package'
          $bin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $source = Join-Path $PWD "src/$project/bin/Release"
            if (-not (Test-Path $source)) { throw "Release output not found: $source" }
            Copy-Item $source (Join-Path $bin $project) -Recurse -Force
          }
          $manifest = [ordered]@{
            product = 'SpatialViewer.CadCore'
            version = $version
            abiVersion = $abiVersion
            tag = "v$version"
            commit = $env:GITHUB_SHA
            runtime = 'x64'
            framework = 'net10.0'
            sourceRepository = 'KiYouJyo/SpatialViewer.CadCore'
            compatibility = 'SpatialViewer 0.2.x'
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $root 'cadcore-release.json') -Value $manifest -Encoding utf8
          Copy-Item CHANGELOG.md (Join-Path $root 'CHANGELOG.md')
          Copy-Item LICENSE (Join-Path $root 'LICENSE')
          $zip = Join-Path $PWD "CadCore-v$version-x64.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path (Join-Path $PWD 'SHA256SUMS.txt') -Encoding ascii

      - name: Write release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $abiVersion = '${{ steps.version.outputs.abiVersion }}'
          @"
          ## SpatialViewer.CadCore v$version

          ### 中文
          - 新增 DIMENSION 语义模型，覆盖线性、对齐、角度、半径、直径、坐标与弧长等标注族；保留测量值、标注文字、定义点、文字位置、样式和子类型参考点，不再把匿名标注块当作黑盒图形。
          - 新增 LEADER 与 MLEADER：保留经典引线顶点、关联注释身份、多根 MLeader 路径、Dogleg、嵌入文字、内容类型和箭头尺寸。
          - CAD-to-Scene 现在可生成可拾取的尺寸线、延伸线、径向/角度标注、基础箭头、引线路径、Dogleg 与 MLeader 文字；角度标注在可用时继续保留解析 `ArcGeometry`。
          - 增加 ACadSharp Writer 驱动的真实 DXF 与 DWG 端到端回归：先把 DIMENSION / LEADER / MLEADER 序列化为 CAD 文件，再通过 CadCore Reader、语义层、Scene、HitTest 与 Golden PNG 链重新验收。
          - 本版不虚假宣称完整 AutoCAD DIMSTYLE：自定义箭头块、Tolerance/Alternate Units 复杂排版、所有关联式标注关系和 MLeader 边框细节仍属于后续精修。
          - CLR ABI 继续稳定为 $abiVersion，与 v0.3.x / v0.4.0 的独立更新激活链保持兼容。

          ### 日本語
          - DIMENSION の意味モデルを追加し、Linear / Aligned / Angular / Radius / Diameter / Ordinate / Arc Length 系を対象に、計測値・表示文字・定義点・文字位置・スタイル・サブタイプ固有参照点を保持します。匿名寸法ブロックを単なる画像として扱いません。
          - LEADER / MLEADER に対応し、従来 Leader の頂点、関連注釈 ID、複数の MLeader パス、Dogleg、埋め込み文字、コンテンツ種別、矢印サイズを保持します。
          - CAD-to-Scene で選択可能な寸法線・補助線・半径/角度寸法・基本矢印・Leader パス・Dogleg・MLeader 文字を生成し、角度寸法は可能な場合 `ArcGeometry` を維持します。
          - ACadSharp Writer を用いた実 DXF / DWG のエンドツーエンド回帰を追加し、DIMENSION / LEADER / MLEADER を実ファイルへ直列化した後に Reader → 意味モデル → Scene → HitTest → Golden PNG を検証します。
          - カスタム矢印ブロック、Tolerance / Alternate Units の完全なレイアウト、すべての連想寸法関係、MLeader フレームなど、完全な AutoCAD DIMSTYLE 再現は本版の対応範囲外です。
          - CLR ABI は $abiVersion のまま維持し、v0.3.x / v0.4.0 の独立更新経路と互換です。

          ### English
          - Adds reader-independent DIMENSION semantics for linear, aligned, angular, radius, diameter, ordinate, and arc-length families, retaining measurement values, display text, definition/text points, style data, and subtype-specific reference points instead of treating anonymous dimension blocks as opaque pictures.
          - Adds LEADER and MLEADER semantics for classic vertices, linked-annotation identity, multiple MLeader paths, doglegs, embedded text, content type, and arrow sizing.
          - CAD-to-Scene now emits pickable dimension/extension lines, radial and angular annotations, basic arrowheads, leader paths, doglegs, and MLeader text; angular dimensions keep analytic `ArcGeometry` when available.
          - Adds ACadSharp-writer-backed real DXF and DWG end-to-end regression: DIMENSION / LEADER / MLEADER are serialized to CAD files and then revalidated through Reader → semantic model → Scene → HitTest → Golden PNG.
          - Full AutoCAD DIMSTYLE fidelity is deliberately not claimed yet: custom arrow blocks, tolerance/alternate-unit layout, every associative dimension relationship, and MLeader framing remain refinement work.
          - The CLR ABI remains $abiVersion and stays compatible with the v0.3.x / v0.4.0 independent-update activation path.
          "@ | Set-Content release-notes.md -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "SpatialViewer.CadCore $tag" `
              --notes-file release-notes.md
            Write-Host "$tag already exists; refreshed release notes."
            exit 0
          }
          gh release create $tag `
            "CadCore-v${{ steps.version.outputs.version }}-x64.zip" `
            'SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "SpatialViewer.CadCore $tag" `
            --notes-file release-notes.md `
            --latest
