name: Publish CadCore Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - 'docs/releases/**'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read release contract
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $abiVersion = [string]$props.Project.PropertyGroup.AbiVersion
          $hostContractName = [string]$props.Project.PropertyGroup.HostContractName
          $hostContractMinVersion = [string]$props.Project.PropertyGroup.HostContractMinVersion
          $hostContractMaxVersionExclusive = [string]$props.Project.PropertyGroup.HostContractMaxVersionExclusive
          $manifestSchemaVersion = [string]$props.Project.PropertyGroup.ReleaseManifestSchemaVersion
          foreach ($required in @($version, $abiVersion, $hostContractName, $hostContractMinVersion, $hostContractMaxVersionExclusive, $manifestSchemaVersion)) {
            if ([string]::IsNullOrWhiteSpace($required)) { throw 'CadCore release contract metadata is incomplete.' }
          }
          if ([int]$manifestSchemaVersion -ne 2) { throw "Unsupported release manifest schema: $manifestSchemaVersion" }
          if ([version]$hostContractMinVersion -ge [version]$hostContractMaxVersionExclusive) { throw 'CadCore host contract range is invalid.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "abiVersion=$abiVersion" >> $env:GITHUB_OUTPUT
          "hostContractName=$hostContractName" >> $env:GITHUB_OUTPUT
          "hostContractMinVersion=$hostContractMinVersion" >> $env:GITHUB_OUTPUT
          "hostContractMaxVersionExclusive=$hostContractMaxVersionExclusive" >> $env:GITHUB_OUTPUT
          "manifestSchemaVersion=$manifestSchemaVersion" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore SpatialViewer.CadCore.sln
      - name: Build Debug
        run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - name: Build Release
        run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - name: Build performance baseline
        run: dotnet build benchmarks/SpatialViewer.Core.Benchmarks/SpatialViewer.Core.Benchmarks.csproj -c Release
      - name: Test Release
        run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal

      - name: Verify product version and stable ABI
        shell: pwsh
        run: |
          $version = [version]'${{ steps.version.outputs.version }}'
          $abiVersion = [version]'${{ steps.version.outputs.abiVersion }}'
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $dll = Get-ChildItem "src/$project/bin/Release" -Recurse -Filter "$project.dll" | Select-Object -First 1
            if (-not $dll) { throw "Release assembly not found: $project.dll" }
            $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version
            if ($assemblyVersion -ne $abiVersion) { throw "ABI mismatch for $project.dll: $assemblyVersion != $abiVersion" }
            $fileVersionText = [Diagnostics.FileVersionInfo]::GetVersionInfo($dll.FullName).FileVersion
            $fileVersion = [version]$fileVersionText
            $normalizedFileVersion = [version]::new($fileVersion.Major, $fileVersion.Minor, [Math]::Max(0, $fileVersion.Build))
            $normalizedProductVersion = [version]::new($version.Major, $version.Minor, [Math]::Max(0, $version.Build))
            if ($normalizedFileVersion -ne $normalizedProductVersion) { throw "Product version mismatch for $project.dll: $fileVersionText != $version" }
          }
          Write-Host "CadCore release identity PASS: product=$version ABI=$abiVersion host=${{ steps.version.outputs.hostContractName }} ${{ steps.version.outputs.hostContractMinVersion }}..<${{ steps.version.outputs.hostContractMaxVersionExclusive }}"

      - name: Package release binaries and manifest
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $abiVersion = '${{ steps.version.outputs.abiVersion }}'
          $root = Join-Path $PWD 'release-package'
          $bin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $source = Join-Path $PWD "src/$project/bin/Release"
            if (-not (Test-Path $source)) { throw "Release output not found: $source" }
            Copy-Item $source (Join-Path $bin $project) -Recurse -Force
          }
          $manifest = [ordered]@{
            schemaVersion = [int]'${{ steps.version.outputs.manifestSchemaVersion }}'
            product = 'SpatialViewer.CadCore'
            version = $version
            abiVersion = $abiVersion
            tag = "v$version"
            commit = $env:GITHUB_SHA
            runtime = 'x64'
            framework = 'net10.0'
            sourceRepository = 'KiYouJyo/SpatialViewer.CadCore'
            hostContract = [ordered]@{
              name = '${{ steps.version.outputs.hostContractName }}'
              minVersion = '${{ steps.version.outputs.hostContractMinVersion }}'
              maxVersionExclusive = '${{ steps.version.outputs.hostContractMaxVersionExclusive }}'
            }
          } | ConvertTo-Json -Depth 4
          $packageManifest = Join-Path $root 'cadcore-release.json'
          Set-Content -Path $packageManifest -Value $manifest -Encoding utf8
          Copy-Item $packageManifest (Join-Path $PWD 'cadcore-release.json') -Force
          Copy-Item CHANGELOG.md (Join-Path $root 'CHANGELOG.md')
          Copy-Item LICENSE (Join-Path $root 'LICENSE')
          $zip = Join-Path $PWD "CadCore-v$version-x64.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash (Join-Path $PWD 'cadcore-release.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  $(Split-Path $zip -Leaf)",
            "$manifestHash  cadcore-release.json"
          ) | Set-Content -Path (Join-Path $PWD 'SHA256SUMS.txt') -Encoding ascii

      - name: Write release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notesPath = Join-Path $PWD "docs/releases/$version.md"
          if (Test-Path $notesPath) {
            Get-Content $notesPath -Raw | Set-Content release-notes.md -Encoding utf8
            Write-Host "Using versioned release notes: $notesPath"
            exit 0
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $pattern = "(?ms)^## $escapedVersion(?: - [^\r\n]+)?\r?\n(?<body>.*?)(?=^## |\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "No release notes file or changelog section found for $version" }
          $body = $match.Groups['body'].Value.Trim()
          "## SpatialViewer.CadCore v$version`r`n`r`n$body" | Set-Content release-notes.md -Encoding utf8
          Write-Host "Using CHANGELOG fallback for $version"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "SpatialViewer.CadCore $tag" `
              --notes-file release-notes.md
            gh release upload $tag `
              "CadCore-v${{ steps.version.outputs.version }}-x64.zip" `
              'cadcore-release.json' `
              'SHA256SUMS.txt' `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
            Write-Host "$tag already exists; refreshed release notes and assets."
            exit 0
          }
          gh release create $tag `
            "CadCore-v${{ steps.version.outputs.version }}-x64.zip" `
            'cadcore-release.json' `
            'SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "SpatialViewer.CadCore $tag" `
            --notes-file release-notes.md `
            --latest
