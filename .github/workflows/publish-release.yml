name: Publish CadCore Release

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
      - 'CHANGELOG.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing from Directory.Build.props' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore SpatialViewer.CadCore.sln
      - name: Build Debug
        run: dotnet build SpatialViewer.CadCore.sln -c Debug --no-restore
      - name: Build Release
        run: dotnet build SpatialViewer.CadCore.sln -c Release --no-restore
      - name: Test Release
        run: dotnet test SpatialViewer.CadCore.sln -c Release --no-build --verbosity normal

      - name: Package release binaries
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $root = Join-Path $PWD 'release-package'
          $bin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $projects = @(
            'SpatialViewer.Core',
            'SpatialViewer.Formats.Cad',
            'SpatialViewer.Formats.Cad.ACadSharp',
            'SpatialViewer.Rendering',
            'SpatialViewer.Rendering.Windows'
          )
          foreach ($project in $projects) {
            $source = Join-Path $PWD "src/$project/bin/Release"
            if (-not (Test-Path $source)) { throw "Release output not found: $source" }
            Copy-Item $source (Join-Path $bin $project) -Recurse -Force
          }
          $manifest = [ordered]@{
            product = 'SpatialViewer.CadCore'
            version = $version
            tag = "v$version"
            commit = $env:GITHUB_SHA
            runtime = 'x64'
            framework = 'net10.0'
            sourceRepository = 'KiYouJyo/SpatialViewer.CadCore'
            compatibility = 'SpatialViewer 0.2.x'
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $root 'cadcore-release.json') -Value $manifest -Encoding utf8
          Copy-Item CHANGELOG.md (Join-Path $root 'CHANGELOG.md')
          Copy-Item LICENSE (Join-Path $root 'LICENSE')
          $zip = Join-Path $PWD "CadCore-v$version-x64.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Path (Join-Path $PWD 'SHA256SUMS.txt') -Encoding ascii

      - name: Write release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          @"
          ## SpatialViewer.CadCore v$version

          ### 中文
          - `LWPOLYLINE / POLYLINE2D` 的 Bulge 弧段现在保留为解析圆弧，不再错误显示为直线弦。
          - CAD 虚线/中心线等线型现在读取实际 pattern，并结合实体 `CELTSCALE` 与全局 `LTSCALE` 在 Win2D 中连续绘制。
          - 圆/椭圆改为基于完整世界变换的 0.25 px 屏幕误差自适应绘制，修复旋转与非均匀缩放后的椭圆变形。
          - CAD 文字现在从完整变换提取屏幕旋转与缩放，旋转文字及缩放块内文字方向/大小正确跟随几何。
          - 新增 `fidelity-v030.dxf` 与针对四项 Fidelity Fix 的回归测试。

          ### 日本語
          - `LWPOLYLINE / POLYLINE2D` の Bulge 円弧を解析的な円弧として保持し、直線の弦として誤表示しないよう修正。
          - CAD の破線・中心線パターンを読み取り、エンティティ `CELTSCALE` とグローバル `LTSCALE` を反映して Win2D で連続描画。
          - 円・楕円を完全なワールド変換後の 0.25 px 画面誤差ベース適応描画へ変更し、回転・非等方スケール時の変形を修正。
          - CAD テキストの画面回転とスケールを完全変換から算出し、回転文字とスケールされたブロック内文字を正しく描画。
          - `fidelity-v030.dxf` と 4 項目の Fidelity Fix 回帰テストを追加。

          ### English
          - Preserve `LWPOLYLINE / POLYLINE2D` bulge segments as analytic arcs instead of incorrect straight chords.
          - Render CAD dash/center patterns using resolved linetype segments with entity `CELTSCALE` and global `LTSCALE`.
          - Render circles/ellipses with adaptive 0.25 px screen-error tessellation after the complete world transform, fixing rotated and non-uniformly scaled ellipses.
          - Derive CAD text screen rotation and scale from the complete transform so rotated and block-scaled text follows geometry correctly.
          - Add `fidelity-v030.dxf` and regression coverage for all four fidelity fixes.
          "@ | Set-Content release-notes.md -Encoding utf8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "$tag already exists; skipping release creation."
            exit 0
          }
          gh release create $tag `
            "CadCore-v${{ steps.version.outputs.version }}-x64.zip" `
            'SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "SpatialViewer.CadCore $tag" `
            --notes-file release-notes.md `
            --latest
